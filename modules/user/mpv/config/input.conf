MBTN_LEFT cycle pause                               #暂停
ESC        set fullscreen no                              # 退出全屏状态
ENTER        cycle fullscreen                               # 循环切换全屏的状态
MBTN_RIGHT cycle fullscreen
a  seek 0 absolute                                   #从头播放

Shift+WHEEL_UP add window-scale 0.05      # 放大窗口
Shift+WHEEL_DOWN add window-scale -0.05   # 缩小窗口

f add sub-scale 0.1 # 增大字幕字体大小
d  add sub-scale -0.1 # 减小字幕字体大小

Ctrl+LEFT  cycle-values video-rotate "0" "270" "180" "90" # 视频输出逆时针旋转90°
Ctrl+RIGHT cycle-values video-rotate "0" "90" "180" "270" # ~~~~~~~~逆~~~~~~~~~~~
Ctrl+WHEEL_UP script-binding positioning/cursor-centric-zoom 0.1 # 向光标位置放大
Ctrl+WHEEL_DOWN script-binding positioning/cursor-centric-zoom -0.1 # 向光标位置缩小

UP              add volume  10                      #event: click
DOWN            add volume -10                      #event: click
RIGHT          cycle pause                         #event: click
RIGHT          no-osd set speed 3; set pause no    #event: press
RIGHT         ignore                              #event: release
F9      vf toggle pad=aspect=16/9:x=-1:y=-1   #保持16:9的宽高比，自动调整窗口大小以适应视频，同时在窗口周围添加黑边以填充剩余空间
ESC       quit                    #event: double_click
MBTN_LEFT_DBL   ignore
r cycle-values video-rotate "90" "180" "270" "0"
c show-text "Frame: ${estimated-frame-number}"
b    script-message-to sub_fastwhisper sub-fastwhisper
#VapourSynth滤镜相关
F5   vf toggle vapoursynth="~~/vs/SVP.py"
F6   vf toggle vapoursynth="~~/vs/MEMC_SVP_PRO.vpy"
KP2   vf toggle vapoursynth="~~/vs/MEMC_MVT_LQ.vpy"
#KP3   vf toggle vapoursynth="~~/vs/SVP.vpy"
KP3   vf toggle vapoursynth="~~/vs/MEMC_SVP_HQ.vpy"
KP_ADD   vf toggle vapoursynth="~~/vs/DENOISE.vpy"
CTRL+0 vf set ""

