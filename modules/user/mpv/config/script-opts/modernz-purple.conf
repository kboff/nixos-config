# 语言和显示
# 设置语言（可用选项请参阅：https://github.com/Samillion/ModernZ/blob/main/docs/TRANSLATIONS.md）
language=zh
# 设置图标主题。可选 fluent 或 material
icon_theme=fluent
# OSC 的字体（默认：mpv-osd-symbols 或 mpv.conf 中设置的字体）
font=mpv-osd-symbols

# 空闲时显示 mpv 标志
idlescreen=yes
# 显示 OSC 窗口顶部栏："auto"、"yes" 或 "no"（无边框/全屏）
window_top_bar=auto
# 窗口模式下显示 OSC
showwindowed=yes
# 全屏时显示 OSC
showfullscreen=yes
# 暂停时显示 OSC
showonpause=no
# 暂停时禁用 OSC 隐藏超时
keeponpause=no
# 关闭十二月显示的圣诞帽装饰
greenandgrumpy=yes

# OSC 行为和缩放
# 鼠标无移动前 OSC 隐藏的时间（毫秒）
hidetimeout=250
# 如果寻求应该重置隐藏超时
seek_resets_hidetimeout=yes
# 淡出持续时间（以毫秒为单位），设置为 0 表示无淡出
fadeduration=100
# 是否启用淡入效果
fadein=yes
# 显示 OSC 所需的最小鼠标移动距离（以像素为单位）
minmousemove=0
# mode for showing OSC/WC on mouse move: always, zones, independent
zones_hover_mode=zones
# 仅在鼠标悬停到底部时显示 OSC
bottomhover=yes
# height of the bottom hover zone (in pixels)
bottomhover_zone=100
# height of the top hover zone (in pixels)
tophover_zone=60
# 搜索时显示 OSC
osc_on_seek=no
# 每个文件开始时显示 OSC
osc_on_start=no
# 按住按钮拖动鼠标快进时暂停视频播放
mouse_seek_pause=yes
# 在鼠标拖动时强制显示进度条提示，即使没有悬停在进度条上
force_seek_tooltip=no

# 随视频缩放控制面板（OSC）
vidscale=auto
# 窗口模式下的 OSC 缩放系数
scalewindowed=0.7
# 全屏时的 OSC 缩放系数
scalefullscreen=0.7

# 界面元素显示设置
# 在 OSC 中显示标题（在进度条上方）
show_title=yes
# 搜索栏上方标题格式："${media-title}" 或 "${filename}"
title=${media-title}
# 标题文本的字体大小（搜索栏上方）
title_font_size=24
# 章节标题字体大小
chapter_title_font_size=14
# 显示缓存时间信息
cache_info=no
# 每秒显示缓存速度
cache_info_speed=no
# 缓存信息的字体大小
cache_info_font_size=12

# 在进度条下方显示章节标题和时间戳
show_chapter_title=yes
# 悬停进度条时章节显示的格式（设置为 'no' 可禁用）
chapter_fmt=%s

# 显示总时间而不是剩余时间
timetotal=yes
# 显示带毫秒的时间码
timems=no
# 使用 Unicode 减号显示剩余时间
unicodeminus=no
# 选择"dynamic" 或"fixed"。dynamic 时尽可能显示 MM:SS，fixed 则始终显示 HH:MM:SS
time_format=dynamic
# 时间显示的字体大小
time_font_size=16
# 提示框字体大小
tooltip_font_size=14

# 标题栏设置
# 在无边框/全屏模式下显示窗口标题
window_title=no
# 显示窗口控制按钮（关闭、最小化、最大化）在无边框/全屏模式下
window_controls=yes
# 与标题相同，但用于窗口顶部栏
windowcontrols_title=${media-title}

# 字幕显示设置
# 当显示时，将字幕提升至 OSC 之上
raise_subtitles=no
# 当显示 OSC 时，字幕提升的高度（以像素为单位）
#raise_subtitle_amount=125

# 按钮显示和功能
# 显示跳转前后按钮
jump_buttons=yes
# 修改跳跃时间（秒）
jump_amount=5
# 修改右键点击跳跃按钮和 Shift 键点击章节跳过按钮时的跳跃时间
jump_more_amount=60
# 当 jump_amount 设置为 5、10 或 30 时显示不同的图标
jump_icon_number=yes
# 跳转按钮的搜索模式
jump_mode=relative
# 按住快进按钮时启用连续跳跃
jump_softrepeat=yes
# 显示章节向前和向后跳过按钮
chapter_skip_buttons=no
# 按住章节跳转按钮时启用连续跳过
chapter_softrepeat=yes
# 显示下一曲/上一曲播放列表按钮
track_nextprev_buttons=yes

# 显示静音按钮和音量滑块
volume_control=yes
# 音量缩放类型："线性"或"对数"
volume_control_type=logarithmic
# 显示播放列表按钮：左键点击为简单播放列表，右键点击为交互式播放列表
playlist_button=yes
# 当不存在播放列表时隐藏播放列表按钮
hide_empty_playlist_button=no
# 当没有播放列表时，将播放列表按钮设为灰色
gray_empty_playlist_button=no

# 在网页视频上显示下载按钮（需要 yt-dlp 和 ffmpeg）
download_button=yes
# 默认视频下载目录 (https://mpv.io/manual/master/#paths)
download_path=~~exe_dir/Capture
# 显示截图按钮
screenshot_button=yes
# 截图按钮的标志："字幕", "视频", "窗口", "每一帧"
screenshot_flag=subtitles

# 顶部显示窗口按钮
ontop_button=yes
# 显示循环按钮
loop_button=yes
# 显示速度控制按钮
speed_button=yes
# 每次点击的速度变化量
speed_button_click=0.5
# 滚动时的速度变化量
speed_button_scroll=0.25
# 显示信息按钮
info_button=yes
# 显示全屏切换按钮
fullscreen_button=yes

# 通过右键点击暂停来启用循环
loop_in_pause=yes

# 强制按钮始终处于激活状态。可以添加：playlist_prev,playlist_next
buttons_always_active=none

# 播放/暂停按钮的图标大小
playpause_size=28
# 中间按钮的图标大小
midbuttons_size=24
# 侧边按钮的图标大小
sidebuttons_size=24

# 在图像查看模式下显示缩放控制
zoom_control=yes
# 最大缩放值
zoom_in_max=4
# 最小缩放值
zoom_out_min=-1

# 颜色和样式
# OSC 和标题栏的强调色
osc_color=#000000

# 文字 & 控件基础色（统一替换为紫调冰雾白，比纯白更柔，同时带极微弱紫意）
window_title_color=#F2EEF9
window_controls_color=#F2EEF9
title_color=#F2EEF9
cache_info_color=#F2EEF9
time_color=#F2EEF9
chapter_title_color=#F2EEF9
side_buttons_color=#F2EEF9
middle_buttons_color=#F2EEF9
playpause_color=#F2EEF9

# 窗口控件悬停色（柔和功能色，调整为与紫色更协调的版本）
windowcontrols_close_hover=#F0A5B0   # 浅莓粉，保留关闭的警示感但不刺眼
windowcontrols_max_hover=#D5B8F0    # 淡薰衣草，最大化用柔和紫色区分
windowcontrols_min_hover=#8B5CF6    # 最小化直接使用主色，与进度条呼应

# 进度条：已完成部分和滑块颜色（主色）
seekbarfg_color=#8B5CF6

# 进度条：剩余部分（主色的低透明度版本，保持8位十六进制逻辑）
seekbarbg_color=#8B5CF659

# 进度条：已缓存区间（浅紫色，在底轨上清晰但不抢眼）
seekbar_cache_color=#D8CCF0

# 使音量条颜色与滑动条颜色匹配
volumebar_match_seek_color=yes

# 元素被按下时的颜色（浅紫，替代原来的海沫绿）
held_element_color=#C9B8E8

# 悬停效果颜色（统一为主色）
hover_effect_color=#8B5CF6

# 缩略图边框颜色
thumbnail_border_color=#8B5CF6
# 缩略图边框轮廓颜色
#thumbnail_border_outline=#5A79F6

# OSC 背景框的 alpha 值
fade_alpha=130
# OSC alpha 淡入的模糊强度。注意：高值可能需要大量 CPU 时间来渲染
fade_blur_strength=100
# 与"fade_blur_strength=0"一起使用，以创建透明框
fade_transparency_strength=0
# 窗口标题栏的 alpha 值（0 为禁用）
window_fade_alpha=100
# 窗口标题栏的模糊强度。注意：高值可能会消耗大量 CPU 时间来渲染
window_fade_blur_strength=100
# 使用"window_fade_blur_strength=0"创建透明框
window_fade_transparency_strength=0
# 缩略图边框宽度（用于 thumbfast）
thumbnail_border=3
# 缩略图边框的圆角半径（设置为 0 可禁用）
thumbnail_border_radius=3

# 按钮悬停效果
# 活跃按钮悬停效果："glow"、"size"、"color"；可使用逗号分隔多个
hover_effect=size,glow,color
# 如果"size"效果激活，悬停按钮的相对大小
hover_button_size=115
# 当"glow"悬停效果激活时，发光强度
button_glow_amount=5
# 鼠标悬停时对滑块把手启用放大缩小效果
hover_effect_for_sliders=yes

# 工具提示和提示信息
# 为禁用的按钮和元素启用提示
tooltips_for_disabled_elements=yes
# 为 info、loop、ontop 和 screenshot 按钮启用文本提示信息
tooltip_hints=yes

# 进度条设置
# 搜索条滑块的大小比例（范围：0 ~ 1）
seek_handle_size=0.8
# 显示搜索范围覆盖层
seekrange=yes
# 搜索范围的不透明度
seekrangealpha=150
# 当时长变化时更新进度条的章节标记
livemarkers=yes
# 拖动进度条时使用关键帧
seekbarkeyframes=no
# 进度条上方显示的章节小标记
nibbles_top=yes
# 进度条下方显示的章节小标记
nibbles_bottom=yes
# 章节标记样式："三角形triangle"、"条形bar"或"单条形single-bar"
nibbles_style=triangle
# color of chapter nibbles on the seekbar
nibble_color=#4B0CDF
# color of the current chapter nibble on the seekbar
nibble_current_color=#CEBBFB

# 根据视频长度自动设置进度条关键帧
automatickeyframemode=yes
# 视频时长超过这个值（以秒为单位）将在进度条上显示关键帧
automatickeyframelimit=5

# 屏幕底部始终显示一条小进度线
persistentprogress=no
# 固定进度条的高度
persistentprogressheight=17
# 在固定进度条上显示网页视频的缓冲状态
persistentbuffer=no

# 其他设置
# 仅在初始化时使用，用于设置 visibility_mode(...)
visibility=auto
# 可循环切换的显示模式，多个模式用 _ 分隔
visibility_modes=never_auto_always
# OSC 重绘之间的最小间隔（以秒为单位）
tick_delay=0.03
# 使用显示 FPS 作为最小重绘间隔
tick_delay_follow_display_fps=no

# 元素位置
# 调整字体大小或类型时有用

# 标题高度位置在进度条上方
title_height=96
# 标题高度位置，如果章节标题在其下方
title_with_chapter_height=108
# 章节标题高度位置，在进度条上方
chapter_title_height=91
# 时间码的高度位置
time_codes_height=35
# 竖屏窗口下时间码的高度位置
time_codes_centered_height=57
# 工具提示的高度位置偏移
tooltip_height_offset=2
# 如果工具提示内容较长，则按偏移量向左移动
tooltip_left_offset=5
# 竖屏窗口宽度触发点，用于移动某些元素
portrait_window_trigger=1000
# 隐藏音量条触发窗口宽度
hide_volume_bar_trigger=1150
# 当进度条上方标题被禁用时，OSC 的高度偏移量
notitle_osc_h_offset=25
# 当章节标题被禁用或不存在时，OSC 的高度偏移量
nochapter_osc_h_offset=10
# 悬停进度条时时间码工具提示的高度位置偏移
seek_hover_tooltip_h_offset=0
# 未应用偏移时的 OSC 高度
osc_height=132

## 鼠标命令
## 详情：https://github.com/Samillion/ModernZ#mouse-commands-user-options

# 进度条上方标题的鼠标操作
title_mbtn_left_command=script-binding stats/display-page-5
title_mbtn_mid_command=show-text ${path}
title_mbtn_right_command=script-binding select/select-watch-history; script-message-to modernz osc-hide

# 播放列表按钮鼠标操作
playlist_mbtn_left_command=script-binding select/menu; script-message-to modernz osc-hide
playlist_mbtn_right_command=script-binding select/select-playlist; script-message-to modernz osc-hide

# 音量鼠标操作
vol_ctrl_mbtn_left_command=no-osd cycle mute
vol_ctrl_mbtn_right_command=script-binding select/select-audio-device; script-message-to modernz osc-hide
vol_ctrl_wheel_down_command=no-osd add volume -5
vol_ctrl_wheel_up_command=no-osd add volume 5

# 音频按钮的鼠标操作
audio_track_mbtn_left_command=script-binding select/select-aid; script-message-to modernz osc-hide
audio_track_mbtn_mid_command=cycle audio down
audio_track_mbtn_right_command=cycle audio
audio_track_wheel_down_command=cycle audio
audio_track_wheel_up_command=cycle audio down

# 字幕按钮的鼠标操作
sub_track_mbtn_left_command=script-binding select/select-sid; script-message-to modernz osc-hide
sub_track_mbtn_mid_command=cycle sub down
sub_track_mbtn_right_command=cycle sub
sub_track_wheel_down_command=cycle sub
sub_track_wheel_up_command=cycle sub down

# 跳过章节按钮的鼠标操作
chapter_prev_mbtn_left_command=add chapter -1
chapter_prev_mbtn_mid_command=show-text ${chapter-list} 3000
chapter_prev_mbtn_right_command=script-binding select/select-chapter; script-message-to modernz osc-hide

chapter_next_mbtn_left_command=add chapter 1
chapter_next_mbtn_mid_command=show-text ${chapter-list} 3000
chapter_next_mbtn_right_command=script-binding select/select-chapter; script-message-to modernz osc-hide

# 章节标题（进度条下方）鼠标操作
chapter_title_mbtn_left_command=script-binding select/select-chapter; script-message-to modernz osc-hide
chapter_title_mbtn_right_command=show-text ${chapter-list} 3000

# 播放列表跳过按钮鼠标操作
playlist_prev_mbtn_left_command=playlist-prev
playlist_prev_mbtn_mid_command=show-text ${playlist} 3000
playlist_prev_mbtn_right_command=script-binding select/select-playlist; script-message-to modernz osc-hide

playlist_next_mbtn_left_command=playlist-next
playlist_next_mbtn_mid_command=show-text ${playlist} 3000
playlist_next_mbtn_right_command=script-binding select/select-playlist; script-message-to modernz osc-hide

# 全屏按钮鼠标操作
fullscreen_mbtn_left_command=cycle fullscreen
fullscreen_mbtn_right_command=cycle window-maximized

# 信息按钮鼠标操作
info_mbtn_left_command=script-binding stats/display-page-1-toggle