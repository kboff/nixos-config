osc=no
#官方文档 https://mpv.io/manual/master
fullscreen=yes                  #启动全屏
pause                                #启动暂停 
keep-open = yes         # 播放完后保持窗口打开，停留在最后一帧
#log-file="~~/mpv.log"

#预设选择
profile=Target,Tscale,HQ,Dither
cscale=catmull_rom
sub-ass-force-margins=yes

hwdec=no       #硬件解码

# 截图保存路径和格式 (https://mpv.io/manual/master/#paths)
screenshot-directory=~~/desktop/
screenshot-format=jpg

deband=yes            #去色带
icc-profile-auto=no             #色彩管理
blend-subtitles=video        #将字幕渲染到视频源分辨率并随视频一起缩放并进行色彩管理
target-trc = gamma2.2         #目标色彩空间的TRC（传输函数）。
#pad=aspect=16/9:x=-1:y=-1   #保持16:9的宽高比，自动调整窗口大小以适应视频，同时在窗口周围添加黑边以填充剩余空间

#interpolation=yes

# 视频输出驱动与图形API
vo=gpu-next
gpu-api= vulkan




# Vulkan 相关优化
#vulkan-swap-mode=mailbox          # 三重缓冲
vulkan-async-transfer=yes           # 异步传输纹理，提升多线程效率

sub-auto=fuzzy                #自动识别字幕
save-position-on-quit=no      #记忆上次播放位置
no-border                     # 默认为系统原生窗口界面，启用此项使用无边框界面（去除 Windows 的窗口装饰）
input-doubleclick-time=200

# 使用 pipewire音频输出（linux）
ao=pipewire
# 允许独占模式，降低延迟和CPU开销
audio-exclusive=no
### Playlist 
directory-mode=ignore
prefetch-playlist=yes
autocreate-playlist=filter
directory-filter-types=videoSeek Handle
osd-fractions=yes                     # 以秒为单位显示 OSD 时间（毫秒精度）
osd-font="HYWenHei"      # 指定 OSD 字体

#字幕样式
sub-pos=100                                 #垂直位置百分比          
sub-font='HYWenHei'      #字体
sub-font-size=30                        #字体大小
sub-color='#FFFFFF'                  #主颜色
sub-border-color='#000000'   #边框颜色
sub-border-size=0.5                  #边框大小
sub-shadow-offset=1                #阴影
sub-use-margins=yes      # 允许字幕使用屏幕边距（黑边）
audio-file-auto=fuzzy                   # 自动加载近似名的外置音轨
sub-auto=fuzzy                          # 自动加载近似名的外置字幕


[minimized]
 #profile-desc=最小化时暂停
 #profile-cond=window_minimized and vid and not get("current-tracks/video/albumart")
 #profile-restore=copy-equal
 #pause

##⇘⇘常规配置没有自动触发条件（内置配置组也全为常规配置）
##需要主设置文件中使用 --profile=<profile1,profile2,...> 或多行 --profile=<xxx> 参数激活数个配置

 [ICC]
 icc-profile=""
 icc-profile-auto 
 icc-intent=0
 icc-force-contrast=1000
 icc-3dlut-size=auto
 icc-cache-dir="~~/cache/icc_cache"

[ICC+]
 icc-profile="~~/icc/ITU-RBT709ReferenceDisplay.icc"
 icc-intent=0
 icc-force-contrast=no
 icc-3dlut-size=auto
 icc-cache-dir="~~/cache/icc_cache"

[Target]
 icc-profile=""
 icc-profile-auto=no
 target-prim=auto
 target-trc=gamma2.2
 target-contrast=auto
 target-peak=auto

[Dither]
 dither-depth=auto
 dither=fruit
 dither-size-fruit=6

[Dither+]
 dither-depth=auto
 dither=error-diffusion
 error-diffusion=floyd-steinberg

[Tscale]
 video-sync=display-resample
 #video-sync-max-video-change=5
 interpolation
 #interpolation-preserve=no
 tscale=oversample

[Tscale+]
 video-sync=display-resample
 #video-sync-max-video-change=5
 interpolation
 #interpolation-preserve=no
 tscale=sphinx
 tscale-blur=0.65

[HQ]
 scale=ewa_hanning
 cscale=bilinear
 dscale=hermite
 scale-antiring=0.5
 dscale-antiring=0.5
 linear-upscaling=no
 sigmoid-upscaling=yes
 correct-downscaling=yes
 linear-downscaling=no
 #scaler-resizes-only=no
 deband=no

[DeBand-low]
 profile-desc=DeBand low
 deband-iterations=1
 deband-threshold=48
 deband-range=16
 deband-grain=16

[DeBand-medium]
 profile-desc=deband medium
 deband-iterations=2
 deband-threshold=64
 deband-range=16
 deband-grain=24

[DeBand-high]
 profile-desc=deband high
 deband-iterations=3
 deband-threshold=64
 deband-range=16
 deband-grain=24

[HDR-PASS]
 profile-desc=HDR 直通参数
 target-colorspace-hint=yes

[SDR2HDR]
 profile-desc=SDR 反向映射 HDR 参数
 inverse-tone-mapping=yes

[HDR2SDR]
 profile-desc=HDR-SDR 映射参数
 tone-mapping=auto
 #tone-mapping-param=1.0
 #tone-mapping-max-boost=1.0
 gamut-mapping-mode=auto
 hdr-contrast-recovery=0.30
 #hdr-contrast-smoothness=3.5
 hdr-compute-peak=auto
 hdr-peak-percentile=99.995
 hdr-peak-decay-rate=20
 hdr-scene-threshold-low=1.0
 hdr-scene-threshold-high=3.0
 allow-delayed-peak-detect=no


# --- OSD全局设置 ---
osd-font='HYWenHei'          # 设置OSD字体，如不使用Windows默认字体则可能需要此项[reference:5]
osd-font-size=24            # 设置OSD字体大小[reference:6]
osd-bold=no               # 可选：加粗字体[reference:7]

osd-border-style=outline-and-shadow  # 设置边框样式为背景框，必须添加，否则边框设置无效[reference:8]

# --- OSD文字、边框、阴影、背景颜色设置 ---
osd-color="#FFFFFF"               # 文字颜色（白色）[reference:9]
osd-border-color="#FFFFFF"        # 边框颜色
osd-shadow-color="#FFFFFF"        # 阴影颜色
osd-back-color="#CCFFFFFF"        # 背景颜色[reference:10]
#osd-border-style=outline-and-shadow  # <默认 outline-and-shadow|opaque-box|background-box> 文本字幕边框的样式
                                      # outline-and-shadow：绘制轮廓和阴影；opaque-box：绘制轮廓和阴影；将轮廓和阴影绘制为不透明框，紧密包裹每一行文本；background-box：绘制一个背景框，将所有文本行框框起来
#osd-spacing=1                        # OSD 文本字幕字间距
#osd-blur=0.5                         # OSD 文本字幕的边缘模糊度 <0..20.0> 
#osd-bar-outline-size=1.2             # OSD 栏的轮廓大小
ytdl-format=bestvideo+bestaudio
ytdl-raw-options=cookies-from-browser=firefox



