# Font Configuration
font_size 12.0
confirm_os_window_close 0
# Window Configuration
window_padding_width 12
# background_opacity 1.0
background_blur 32
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
map ctrl+shift+t new_tab

# Fzf file picker
map ctrl+f launch --type=overlay --cwd=current fish -c 'fzf-open'

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

background_opacity 0.80
scrollbar_handle_opacity 0.50
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0
confirm_os_window_cLose  0
sync_to_monitor no
repaint_delay	8
input_delay 	3
cursor_trail 3

# Dank color generation
include dank-tabs.conf
include dank-theme.conf


# BEGIN_KITTY_FONTS
font_family      family="Maple Mono Normal NF CN"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
